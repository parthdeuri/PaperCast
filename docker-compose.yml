services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      # Mount only the code (for live edits) and the runtime data folders.
      # Mounting the whole project over /app would hide the Kokoro model
      # files the Dockerfile downloads into /app.
      - ./src:/app/src
      - ./dashboard:/app/dashboard
      - ./chroma_db:/app/chroma_db
      - ./logs:/app/logs
      - ./outputs:/app/outputs
    environment:
      - PODCAST_PROVIDER=${PODCAST_PROVIDER:-gemini}
      # Empty means config.py picks the provider's default model.
      - PODCAST_MODEL=${PODCAST_MODEL:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      # Inside the container, Ollama on the host is host.docker.internal, not localhost.
      - OPENAI_API_BASE=${OPENAI_API_BASE:-http://host.docker.internal:11434/v1}
      - PODCAST_MOCK_MODE=${PODCAST_MOCK_MODE:-0}
